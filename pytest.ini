[pytest]
DJANGO_SETTINGS_MODULE = core.settings
python_files = test_*.py
testpaths = tests
addopts = -ra --strict-markers --strict-config --cov=api --cov-report=term-missing
markers =
    unit: isolated unit tests of business logic
    integration: endpoint tests exercising the database
    contract: request/response schema contract tests
    workflow: multi-step extraction lifecycle tests
    resilience: retries, recovery, concurrency, failure injection
    security: authentication, authorization, tenant isolation, secrets
    e2e: live third-party integration (requires HUBSPOT_TEST_TOKEN)
